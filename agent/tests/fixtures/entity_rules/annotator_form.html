<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Annotator Form Fixture</title>
  <style>
    body { font-family: sans-serif; padding: 40px; }
    form { width: 420px; padding: 24px; border: 1px solid #bbb; }
    label, input, button { display: block; margin: 8px 0; }
    input { width: 100%; padding: 8px; }
  </style>
</head>
<body>
  <form id="CustomerForm">
    <label for="CustomerName">Customer name</label>
    <input id="CustomerName" name="customerName" autocomplete="off">
    <button id="SaveCustomer" type="submit">Save customer</button>
  </form>
</body>
</html>
