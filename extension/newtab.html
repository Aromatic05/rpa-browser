<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RPA Browser</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f5f7fb;
      --surface: #ffffff;
      --surface-soft: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #e4e7ec;
      --accent: #176b5f;
      --accent-hover: #12574e;
      --ok: #16805d;
      --shadow: 0 18px 50px rgba(16, 24, 40, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      color: var(--text);
      background: var(--page);
    }
    .shell {
      width: min(920px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 56px 0 72px;
    }
    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 36px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }
    .mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: var(--text);
      color: #fff;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.025em;
    }
    .hero p {
      max-width: 650px;
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }
    .connection {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
    }
    .connection::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #98a2b3;
    }
    .connection.ok::before { background: var(--ok); }
    .panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title h2 {
      margin: 0 0 4px;
      font-size: 18px;
      letter-spacing: -0.01em;
    }
    .panel-title p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }
    .panel-tools {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }
    #restoreStatus {
      color: var(--muted);
      font-size: 12px;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 120ms ease, border-color 120ms ease, transform 120ms ease;
    }
    button:hover:not(:disabled) { background: var(--surface-soft); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    button.primary:hover:not(:disabled) { background: var(--accent-hover); }
    .restore-list { display: grid; }
    .restore-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 74px;
      padding: 16px 22px;
      border-bottom: 1px solid var(--line);
    }
    .restore-item:last-child { border-bottom: 0; }
    .restore-meta {
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }
    .restore-meta strong {
      display: block;
      overflow: hidden;
      margin-bottom: 3px;
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .state-ready { color: var(--ok); }
    .empty {
      padding: 44px 22px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
    }
    @media (max-width: 680px) {
      .shell { width: min(100% - 24px, 920px); padding-top: 32px; }
      .hero { flex-direction: column; }
      .panel-header { align-items: flex-start; flex-direction: column; }
      .panel-tools { width: 100%; justify-content: space-between; }
      .restore-item { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <div class="brand">
          <div class="mark" aria-hidden="true">R</div>
          <h1>RPA Browser</h1>
        </div>
        <p>Run saved automations here. Open any website to create tasks, teach procedures, or annotate page knowledge from the Agent sidebar.</p>
      </div>
      <div id="connectionPill" class="connection"><strong id="wsStatus">Connecting…</strong></div>
    </header>

    <section class="panel" aria-labelledby="automationTitle">
      <div class="panel-header">
        <div class="panel-title">
          <h2 id="automationTitle">Automations</h2>
          <p>Only complete, runnable automations are shown here.</p>
        </div>
        <div class="panel-tools">
          <span id="restoreStatus" aria-live="polite">Loading…</span>
          <button id="refreshRestore" type="button">Refresh</button>
        </div>
      </div>
      <div id="restoreList" class="restore-list"></div>
    </section>

  </main>
  <script type="module" src="./start/newtab.js"></script>
</body>
</html>
